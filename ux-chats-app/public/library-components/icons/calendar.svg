<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Simple grid calendar with binding rings -->
  <g fill="none" stroke="var(--icon-color, #1C1430)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="20" width="76" height="68" rx="7" />
    <line x1="12" y1="38" x2="88" y2="38" />
    <line x1="28" y1="10" x2="28" y2="26" />
    <line x1="72" y1="10" x2="72" y2="26" />
  </g>
  <g fill="var(--icon-color, #1C1430)">
    <circle cx="30" cy="52" r="4.5" />
    <circle cx="50" cy="52" r="4.5" />
    <circle cx="70" cy="52" r="4.5" />
    <circle cx="30" cy="70" r="4.5" />
    <circle cx="50" cy="70" r="4.5" fill="var(--accent-color, #FF5A1F)" />
  </g>
</svg>
